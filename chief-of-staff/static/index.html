<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chief of Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
:root{
  --bg:#ffffff; --side:#f6f6f6; --line:#e7e7e7; --text:#141414; --muted:#8a8a8a; --bubble:#efefef;
  --tile:#e9e9e9; --blue:#2a7fff; --ok:#16a34a; --err:#dc2626; --warn:#f59e0b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tools{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px 6px}
.circle{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:18px;color:#333}
.circle:hover{background:#fafafa}
.lead{display:flex;gap:10px;align-items:flex-start;padding:10px 16px 18px}
.leadTile{width:118px;flex:none;background:var(--tile);border-radius:18px;padding:12px 8px 10px;text-align:center;border:2px solid transparent}
.leadTile.active{border-color:#d4d4d4}
.leadTile .nm{font-weight:500;margin-top:6px;font-size:14px}
.leadNote{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 11px;font-size:12.5px;box-shadow:0 2px 10px #0000000d;cursor:pointer;margin-top:4px}
.leadNote b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:2px}
.leadNote span{color:#555;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.list{flex:1;overflow-y:auto;padding:0 8px}
.agent{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 10px;border-radius:14px}
.agent:hover{background:#ececec}
.agent.active{background:#e6e6e6}
.agent .meta{min-width:0;flex:1}
.agent .nm{font-weight:500;font-size:15.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent .pv{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent.unread .pv{color:var(--text);font-weight:500}
.udot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}
.me{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.me .ini{width:40px;height:40px;border-radius:50%;background:#e4e4e4;display:grid;place-items:center;font-weight:500;color:#555}
.me .nm{flex:1;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.integ{padding:4px 16px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.integ .on:before{content:"● ";color:var(--ok)} .integ .off:before{content:"○ "}

/* blob avatars */
.blob{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;font-size:18px}
.blob.s{width:46px;height:46px}
.blob.l{width:72px;height:72px;margin:0 auto;font-size:30px}
.blob.xs{width:22px;height:22px;font-size:11px}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.topbar{position:absolute;top:0;left:0;right:0;padding:14px 0 18px;display:flex;justify-content:center;pointer-events:none;z-index:5;background:linear-gradient(#fff 70%,#fff0)}
.pill{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:7px 18px 7px 8px;box-shadow:0 2px 12px #0000000f;font-weight:500;font-size:16px}
.pill small{color:var(--muted);font-weight:400;font-size:12px}
.topright{position:absolute;top:14px;right:18px;display:flex;gap:8px;z-index:6}
.btn{border:1px solid var(--line);border-radius:30px;padding:9px 18px;background:#fff;font-weight:500}
.btn:hover{background:#fafafa}
.menu{display:none;position:absolute;top:14px;left:14px;z-index:6}
.feed{flex:1;overflow-y:auto;padding:84px 0 20px}
.wrap{max-width:900px;margin:0 auto;padding:0 28px}
.bubble{background:var(--bubble);border-radius:22px;padding:14px 20px;margin:0 0 16px;max-width:100%;font-size:16px;line-height:1.6}
.row{display:flex;flex-direction:column;align-items:flex-start}
.row.you{align-items:flex-end}
.row.you .bubble{background:#1f1f1f;color:#fff;max-width:75%}
.row.you .bubble a{color:#9cc3ff}
.from{font-size:12.5px;color:var(--muted);margin:0 0 4px 6px;display:flex;align-items:center;gap:6px}
.row.peer .bubble{background:#f1efff;border:1px solid #e1dcff}
.md p{margin:.45em 0}.md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
.md table{border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid #dcdcdc;padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:#e6e6e6}
.md a{color:var(--blue)}
.md code{background:#e2e2e2;padding:1px 5px;border-radius:5px;font-size:13.5px}
.md pre{background:#e7e7e7;padding:10px;border-radius:10px;overflow-x:auto}
.md ul,.md ol{padding-left:1.3em;margin:.4em 0}
.tool{margin:-6px 0 14px 8px;font-size:12.5px;color:var(--muted)}
.tool summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border:1px solid var(--line);border-radius:20px;max-width:100%}
.tool summary span.a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;opacity:.75}
.tool summary::-webkit-details-marker{display:none}
.tool pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;border:1px solid var(--line);border-radius:10px;padding:9px;margin:6px 0 0;max-height:280px;overflow:auto;font-size:12px;color:#444}
.v{color:var(--ok)} .x{color:var(--err)}
.err{color:var(--err);background:#fff1f1;border:1px solid #fecaca;padding:9px 14px;border-radius:14px;margin:0 0 16px;font-size:14px}
.divider{display:flex;align-items:center;gap:14px;color:var(--blue);font-size:13px;font-weight:500;margin:22px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:#c9dcff}
.stamp{text-align:center;color:var(--muted);font-size:14px;margin:22px 0 14px}
.thinking{color:var(--muted);font-size:14px;margin:0 0 16px 8px}

/* inline email draft card (approval) */
.draft{border:1px solid var(--line);border-radius:22px;padding:18px 22px 16px;margin:0 0 18px;background:#fff;box-shadow:0 2px 14px #0000000a}
.draft .hd{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:10px}
.draft .f{display:flex;gap:10px;align-items:center;border-bottom:1px solid #f0f0f0;padding:4px 0}
.draft .f label{color:var(--muted);font-size:13px;width:58px;flex:none}
.draft input,.draft textarea{flex:1;border:0;outline:0;font:inherit;color:var(--text);background:none;padding:4px 0}
.draft textarea{width:100%;min-height:150px;resize:vertical;margin-top:8px;line-height:1.55;color:#555}
.draft .why{font-size:13px;color:#666;margin-bottom:6px}
.draft .acts{display:flex;justify-content:flex-end;align-items:center;gap:18px;margin-top:8px}
.discard{color:#555;font-size:16px;padding:10px 6px}
.discard:hover{color:var(--text)}
.sendbtn{background:#141414;color:#fff;border-radius:30px;padding:11px 28px;font-weight:500;font-size:16px}
.sendbtn:disabled,.discard:disabled{opacity:.4}

.empty{text-align:center;color:var(--muted);margin-top:10vh}
.empty h2{color:var(--text);margin:14px 0 6px;font-size:22px;font-weight:600}
.empty p{max-width:520px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:14px}
.chip:hover{background:#f7f7f7}

.composer{padding:10px 24px 20px}
.box{max-width:1200px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:32px;padding:8px 8px 8px 10px;box-shadow:0 2px 14px #0000000a}
.plus{width:40px;height:40px;border-radius:50%;background:#f3f3f3;font-size:22px;color:#555;flex:none}
textarea#input{flex:1;resize:none;border:0;outline:0;font:inherit;font-size:16px;max-height:200px;padding:9px 0;background:none;color:var(--text)}
.go{width:42px;height:42px;border-radius:50%;background:#141414;color:#fff;font-size:18px;flex:none}
.go:disabled{opacity:.3}

/* activity drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px #0000001a;transform:translateX(105%);transition:.2s;z-index:30;display:flex;flex-direction:column}
.app.showact .drawer{transform:none}
.drawer h3{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:16px;display:flex;justify-content:space-between}
.acts-list{overflow-y:auto;padding:6px 20px}
.act{padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.act .r{display:flex;align-items:center;gap:6px;font-weight:500}
.act .t{color:var(--muted);font-size:12px;font-weight:400}
.act .s{color:#555;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scrim{display:none;position:fixed;inset:0;background:#0003;z-index:20}
.app.showside .scrim,.app.showact .scrim{display:block}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:88%;z-index:25;transform:translateX(-102%);transition:.2s}
  .app.showside .side{transform:none}
  .menu{display:grid}
  .wrap{padding:0 16px}.composer{padding:8px 12px 14px}
  .topright .btn.hide-sm{display:none}
  .pill small{display:none}
  .bubble{font-size:15px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" onclick="closePanels()"></div>
  <aside class="side">
    <div class="tools">
      <button class="circle" title="Activity between agents" onclick="toggle('showact')">⇄</button>
      <button class="circle" title="New conversation with this agent" onclick="clearThread()">＋</button>
    </div>
    <div class="lead" id="lead"></div>
    <div class="list" id="list"></div>
    <div class="integ" id="integ"></div>
    <div class="me"><div class="ini" id="meIni"></div><div class="nm" id="meName"></div></div>
  </aside>

  <main class="main">
    <button class="circle menu" onclick="toggle('showside')">☰</button>
    <div class="topbar"><div class="pill" id="pill"></div></div>
    <div class="topright"><button class="btn hide-sm" onclick="toggle('showact')" id="actBtn">Activity</button></div>
    <div class="feed" id="feed"><div class="wrap"><div id="msgs"></div><div id="thinking"></div><div id="drafts"></div></div></div>
    <div class="composer">
      <div class="box">
        <button class="plus" title="New conversation" onclick="clearThread()">+</button>
        <textarea id="input" rows="1" placeholder="Message…"></textarea>
        <button class="go" id="sendBtn" onclick="send()" title="Send">↑</button>
      </div>
    </div>
  </main>

  <aside class="drawer">
    <h3>Agent activity <button onclick="closePanels()">✕</button></h3>
    <div class="acts-list" id="activity"></div>
  </aside>
</div>

<script>
let AGENTS = [], BY_ID = {}, USER = {}, current = lsGet("cos_agent") || "chess";
let lastId = 0, lastTs = 0, STATUS = {}, PREVIEWS = {}, draftKey = "", dividerShown = false, seenAtOpen = 0;
const SUGGEST = {
  chess: ["Find 10 Series A AI startups in NYC hiring engineers and add the founders to HubSpot",
          "Ask Alex to find the VP of Talent at Stripe and draft an intro email",
          "What can my team do?"],
  alex:  ["Find the Head of Recruiting at Notion and their email",
          "Identify 5 senior ML engineers in Austin with startup experience",
          "Research ramp.com and add the company and its founders to HubSpot"]
};
function lsGet(k){ try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k,v){ try { localStorage.setItem(k,v) } catch {} }
const seen = id => +(lsGet("cos_seen_"+id) || 0);
const markSeen = (id, mid) => { if (mid > seen(id)) lsSet("cos_seen_"+id, mid); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => (window.marked && window.DOMPurify) ? DOMPurify.sanitize(marked.parse(s || "")) : esc(s).replace(/\n/g,"<br>");
const strip = s => String(s||"").replace(/[#*_`>|\[\]]/g,"").replace(/\s+/g," ").trim();
const nm = id => id === "you" ? "You" : (BY_ID[id]?.name || id);
function blob(a, size="s", extra="") {
  return `<div class="blob ${size}" style="background:${a.color}">${esc(a.name[0])}</div>`;
}
const busy = id => STATUS[id]?.state === "working";
function fmtTime(t){
  const d = new Date(t*1000), now = new Date();
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  return d.toDateString() === now.toDateString() ? `Today ${time}` : `${d.toLocaleDateString([], {month:"short", day:"numeric"})} ${time}`;
}
function ago(t){ const s = Date.now()/1000 - t; return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"; }

async function api(path, opts={}) {
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts});
  if (!r.ok) { let d; try { d = (await r.json()).detail } catch { d = r.statusText } throw new Error(d); }
  return r.json();
}

async function init() {
  const d = await api("/api/agents");
  AGENTS = d.agents; AGENTS.forEach(a => BY_ID[a.id] = a); USER = d.user;
  if (!BY_ID[current]) current = "chess";
  document.getElementById("meName").textContent = USER.name;
  document.getElementById("meIni").textContent = USER.name.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const i = d.integrations, tag = (k,v) => `<span class="${v?"on":"off"}">${k}</span>`;
  document.getElementById("integ").innerHTML = tag("Gemini",i.gemini)+tag("Gmail", i.gmail)+tag("HubSpot",i.hubspot)+tag("Hunter",i.hunter)+
    `<span>${i.auto_send ? "Emails auto-send" : "Emails need approval"}</span>`;
  selectAgent(current);
}

function renderSidebar() {
  const lead = AGENTS.find(a => a.lead), pv = PREVIEWS[lead.id];
  const leadUnread = pv && pv.id > seen(lead.id) && current !== lead.id;
  document.getElementById("lead").innerHTML = `
    <button class="leadTile ${current===lead.id?"active":""}" onclick="selectAgent('${lead.id}')">
      ${blob(lead,"l")}
      <div class="nm">${esc(lead.name)}</div></button>
    <div class="leadNote" onclick="selectAgent('${lead.id}')"><b>${blob(lead,"xs")}${esc(lead.name)} ${leadUnread?'<span class="udot"></span>':""}</b>
      <span>${esc(busy(lead.id) ? (STATUS[lead.id].detail||"Working…") : (pv ? strip(pv.content) : lead.title))}</span></div>`;
  document.getElementById("list").innerHTML = AGENTS.filter(a => !a.lead).map(a => {
    const p = PREVIEWS[a.id], unread = p && p.id > seen(a.id) && current !== a.id;
    const preview = busy(a.id) ? (STATUS[a.id].detail || "Working…") : (p ? strip(p.content) : a.title);
    return `<button class="agent ${a.id===current?"active":""} ${unread?"unread":""}" onclick="selectAgent('${a.id}')">
      ${blob(a,"s")}
      <div class="meta"><div class="nm">${esc(a.name)}${unread?'<span class="udot"></span>':""}</div>
      <div class="pv">${esc(preview)}</div></div></button>`;
  }).join("");
}

function selectAgent(id) {
  current = id; lsSet("cos_agent", id);
  lastId = 0; lastTs = 0; draftKey = ""; dividerShown = false; seenAtOpen = seen(id);
  document.getElementById("msgs").innerHTML = "";
  document.getElementById("drafts").innerHTML = "";
  const a = BY_ID[id];
  document.getElementById("pill").innerHTML = `${blob(a,"xs")} ${esc(a.name)} <small>${esc(a.title)}${a.gmail_account ? " · " + esc(a.gmail_account) : ""}</small>`;
  document.getElementById("input").placeholder = `Message ${a.name}`;
  closePanels(); renderSidebar(); poll(true);
}

function renderMessage(m) {
  const a = BY_ID[current];
  let html = "";
  if (!dividerShown && seenAtOpen && m.id > seenAtOpen && m.role !== "tool") { html += `<div class="divider">NEW</div>`; dividerShown = true; }
  if (m.role !== "tool" && m.created_at - lastTs > 1800) html += `<div class="stamp">${fmtTime(m.created_at)}</div>`;
  if (m.role !== "tool") lastTs = m.created_at;
  if (m.role === "tool") {
    const meta = m.meta || {};
    if (m.content === "approval") return html + `<div class="tool"><span class="${meta.ok?"v":"x"}">${meta.ok?"✓":"✕"}</span> ${esc(meta.result)}</div>`;
    const label = m.content === "delegate_to_agent" ? `Asked ${esc(nm(meta.args?.agent_id))}` : esc(m.content.replace(/_/g," "));
    const args = Object.entries(meta.args||{}).filter(([k])=>k!=="agent_id").map(([,v])=>String(v)).join(" · ");
    return html + `<details class="tool"><summary><span class="${meta.ok?"v":"x"}">${meta.ok?"✓":"✕"}</span> ${label} <span class="a">${esc(args)}</span></summary>
      <pre>${esc(JSON.stringify(meta.args, null, 2))}\n\n→ ${esc(meta.result)}</pre></details>`;
  }
  if (m.role === "error") return html + `<div class="err">⚠ ${esc(m.content)}</div>`;
  if (m.role === "user" && m.sender !== "you") {
    const p = BY_ID[m.sender] || {name:m.sender, color:"#999"};
    return html + `<div class="row peer"><div class="from">${blob(p,"xs")} ${esc(p.name)} asked ${esc(a.name)}</div><div class="bubble md">${md(m.content)}</div></div>`;
  }
  if (m.role === "user") return html + `<div class="row you"><div class="bubble md">${md(m.content)}</div></div>`;
  return html + `<div class="row"><div class="bubble md">${md(m.content)}</div></div>`;
}

function renderEmpty() {
  const a = BY_ID[current];
  return `<div class="empty">${blob(a,"l")}<h2>${esc(a.name)}</h2><p>${esc(a.greeting)}</p>
    <div class="chips">${(SUGGEST[a.id]||[]).map(s=>`<button class="chip" onclick='useSuggestion(${JSON.stringify(s)})'>${esc(s)}</button>`).join("")}</div></div>`;
}
function useSuggestion(s){ const t=document.getElementById("input"); t.value=s; t.focus(); autosize(); }

let polling = false;
async function poll(force=false) {
  if (polling && !force) return;
  polling = true;
  try {
    const forAgent = current;
    const d = await api(`/api/state?agent=${forAgent}&after=${lastId}`);
    if (forAgent !== current) return;
    const changed = JSON.stringify([d.status, d.previews]) !== JSON.stringify([STATUS, PREVIEWS]);
    STATUS = d.status; PREVIEWS = d.previews;
    const box = document.getElementById("msgs"), feed = document.getElementById("feed");
    const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
    if (d.messages.length) {
      box.querySelector(".empty")?.remove();
      box.insertAdjacentHTML("beforeend", d.messages.map(renderMessage).join(""));
      lastId = d.messages[d.messages.length-1].id;
    }
    if (!lastId && !box.querySelector(".empty")) box.innerHTML = renderEmpty();
    document.getElementById("thinking").innerHTML = busy(current)
      ? `<div class="thinking">${esc(STATUS[current].detail||"Working…")}</div>` : "";
    document.getElementById("sendBtn").disabled = busy(current);
    const draftsChanged = renderDrafts(d.approvals);
    if (force || ((d.messages.length || busy(current) || draftsChanged) && nearBottom)) feed.scrollTop = feed.scrollHeight;
    if (lastId) markSeen(current, PREVIEWS[current]?.id || lastId);
    if (changed || force) renderSidebar();
    renderActivity(d.activity);
  } catch (e) { console.error(e); }
  finally { polling = false; }
}
setInterval(poll, 1500);

// Pending emails show inline as draft cards: the lead sees everyone's, each agent sees its own.
function renderDrafts(all) {
  const list = BY_ID[current].lead ? all : all.filter(x => x.agent_id === current);
  const key = list.map(x=>x.id).join(",");
  document.getElementById("actBtn").textContent = all.length ? `Activity · ${all.length} to review` : "Activity";
  if (key === draftKey) return false;
  draftKey = key;
  document.getElementById("drafts").innerHTML = list.slice().reverse().map(ap => {
    const p = ap.payload, who = BY_ID[ap.agent_id] || {name: ap.agent_id, color:"#999"};
    return `<div class="draft" id="ap${ap.id}">
      <div class="hd">${blob(who,"xs")} ${esc(who.name)} drafted an email · not sent yet</div>
      ${p.reason ? `<div class="why">${esc(p.reason)}</div>` : ""}
      <div class="f"><label>From</label><span style="padding:4px 0">${esc(p.from_account || "no Gmail assigned")}</span></div>
      <div class="f"><label>To</label><input data-f="to" value="${esc(p.to)}"></div>
      <div class="f"><label>Subject</label><input data-f="subject" value="${esc(p.subject)}"></div>
      <textarea data-f="body">${esc(p.body)}</textarea>
      <div class="acts"><button class="discard" onclick="decide(${ap.id},'reject')">Discard</button>
        <button class="sendbtn" onclick="decide(${ap.id},'approve')">Send</button></div></div>`;
  }).join("");
  return true;
}

async function decide(id, decision) {
  const card = document.getElementById("ap"+id), edits = {};
  card.querySelectorAll("[data-f]").forEach(el => edits[el.dataset.f] = el.value);
  card.querySelectorAll("button").forEach(b => b.disabled = true);
  try { await api(`/api/approvals/${id}/${decision}`, {method:"POST", body: JSON.stringify(edits)}); draftKey = "-"; poll(true); }
  catch (e) { alert(e.message); card.querySelectorAll("button").forEach(b => b.disabled = false); }
}

function renderActivity(list) {
  document.getElementById("activity").innerHTML = list.length ? list.map(x => {
    const f = BY_ID[x.from_agent] || {name:x.from_agent,color:"#999"}, t = BY_ID[x.to_agent] || {name:x.to_agent,color:"#999"};
    return `<div class="act"><div class="r">${blob(f,"xs")} ${esc(f.name)} → ${blob(t,"xs")} ${esc(t.name)} <span class="t">· ${ago(x.created_at)}</span></div>
      <div class="s">${esc(x.summary)}</div></div>`;
  }).join("") : `<p style="color:var(--muted)">When Chess hands work to the team, it shows up here.</p>`;
}

async function send() {
  const t = document.getElementById("input"), text = t.value.trim();
  if (!text || busy(current)) return;
  t.value = ""; autosize();
  try {
    await api(`/api/agents/${current}/chat`, {method:"POST", body: JSON.stringify({text})});
    STATUS[current] = {state:"working", detail:"Thinking…"};
    poll(true);
  } catch (e) { alert(e.message); t.value = text; }
}

async function clearThread() {
  if (!confirm(`Start a new conversation with ${BY_ID[current].name}? This clears the current one.`)) return;
  await api(`/api/agents/${current}/messages`, {method:"DELETE"});
  selectAgent(current);
}

function autosize(){ const t=document.getElementById("input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,200)+"px"; }
document.getElementById("input").addEventListener("input", autosize);
document.getElementById("input").addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
function toggle(c){ document.getElementById("app").classList.toggle(c); }
function closePanels(){ document.getElementById("app").classList.remove("showside","showact"); }
init();
</script>
</body>
</html>
